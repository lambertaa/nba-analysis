version: '3.8'

services:
  nba-draft-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-draft-prediction-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      # Mount models directory for easy updates
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

